<!--
  component: art-placeholder
  Styles: components/art-placeholder/art-placeholder.css
  Drop inside .beat-media, .hero figure, or .hero-media.
  Not a section. The alt text is the art brief. Swap this <img> for
  a real file when the art ships. Search ART TO PRODUCE.

  Generate [placeholder_src] with make.py. Do not copy hero.svg or beat.svg.
  file      target path, e.g. assets/pattern.png
  w h       1024 768 for beats. 1440 720 for a hero.
  brief     one or two short lines. What the picture should show.
-->
<!-- ART TO PRODUCE: [file] ([w]×[h]). The alt text is the brief. Swap the src. -->
<img
  class="art-placeholder"
  src="[placeholder_src]"
  width="[w]"
  height="[h]"
  alt="[brief]"
/>
