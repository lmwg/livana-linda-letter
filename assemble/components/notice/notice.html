<!--
  component: notice
  Styles: components/notice/notice.css
  Callout / update box. Not a beat. Not a button.

  Hosts:
    .cta-solo                 usual home
    a thin .wrap section      if it sits alone
    .beat-body              only if the brief puts a note in a teaching beat

  notice--info is the green update. Do not invent a new modifier without a sheet.
-->
<div class="notice notice--info">
  <p>
    <span class="notice-label">[label]</span>
    [body]
  </p>
</div>
