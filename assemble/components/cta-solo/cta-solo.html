<!--
  component: cta-solo
  Styles: components/cta-solo/cta-solo.css
  Also link notice.css and cta.css — this section hosts those modules.

  A standalone offer beat. Not a beat. Do not put a beat-label on it.

  kicker          optional line over the button. Omit the p if unused.
-->
<section class="wrap cta-solo" aria-label="[aria]">
  <div class="notice notice--info">
    <p>
      <span class="notice-label">[notice_label]</span>
      [notice_body]
    </p>
  </div>
  <p class="cta-kicker">
    <strong>[kicker]</strong>
  </p>
  <div class="cta-block">
    <a class="btn" href="[cta_href]">[cta_label]</a>
    <p class="trust">
      <strong>[trust_reviews]</strong>
      Reviews |
      <strong>[trust_guarantee]</strong>
      Guarantee
    </p>
  </div>
</section>
